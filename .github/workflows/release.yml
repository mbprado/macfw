name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9][0-9].[0-9][0-9][0-9]'
      - 'fw410-[0-9]*.[0-9][0-9].[0-9][0-9][0-9]'
      - 'fw1814-[0-9]*.[0-9][0-9].[0-9][0-9][0-9]'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-15-intel

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve device and validate version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in
            fw410-*)
              DEVICE=fw410
              VERSION="${TAG#fw410-}"
              DISPLAY_NAME="M-Audio FireWire 410"
              NOTES_FILE="RELEASE-NOTES.md"
              ;;
            fw1814-*)
              DEVICE=fw1814
              VERSION="${TAG#fw1814-}"
              DISPLAY_NAME="M-Audio FireWire 1814"
              NOTES_FILE="devices/fw1814/RELEASE-NOTES.md"
              ;;
            *)
              # Preserve the original numeric-tag FW410 release contract.
              DEVICE=fw410
              VERSION="$TAG"
              DISPLAY_NAME="M-Audio FireWire 410"
              NOTES_FILE="RELEASE-NOTES.md"
              ;;
          esac

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]{2}\.[0-9]{3}$ ]]; then
            echo "error: release version '$VERSION' does not match x.yy.zzz" >&2
            exit 1
          fi
          HEADER="devices/${DEVICE}/version.h"
          SOURCE_VERSION="$(sed -n 's/^#define MACFW_VERSION "\([^"]*\)"/\1/p' "$HEADER" | head -1)"
          if [[ -z "$SOURCE_VERSION" || "$VERSION" != "$SOURCE_VERSION" ]]; then
            echo "error: tag version '$VERSION' does not match $HEADER version '$SOURCE_VERSION'" >&2
            exit 1
          fi

          echo "RELEASE_DEVICE=$DEVICE" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_DISPLAY_NAME=$DISPLAY_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES_FILE=$NOTES_FILE" >> "$GITHUB_ENV"
          echo "release device: $DEVICE"
          echo "release version: $VERSION"
          echo "commit: $(git rev-parse HEAD)"

      - name: Build release package
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make "${RELEASE_DEVICE}-package"

      - name: Validate package artifact
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          pkgs=(package/dist/macfw-${RELEASE_DEVICE}-${RELEASE_VERSION}-*.pkg)
          if [[ ${#pkgs[@]} -ne 1 ]]; then
            echo "error: expected exactly one ${RELEASE_DEVICE} package, found ${#pkgs[@]}" >&2
            printf '  %s\n' "${pkgs[@]:-}"
            exit 1
          fi
          echo "PKG_PATH=${pkgs[0]}" >> "$GITHUB_ENV"
          echo "PKG_NAME=$(basename "${pkgs[0]}")" >> "$GITHUB_ENV"

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd package/dist
          shasum -a 256 "$PKG_NAME" > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "$PKG_PATH" \
            package/dist/SHA256SUMS \
            --title "macfw ${RELEASE_DISPLAY_NAME} ${RELEASE_VERSION} Alpha" \
            --notes-file "$RELEASE_NOTES_FILE" \
            --prerelease
